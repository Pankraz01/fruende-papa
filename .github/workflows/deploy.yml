name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy noch, wird es nicht abgebrochen, sondern der neue eingereiht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node-Version des Projekts (22). Die Action selbst läuft auf Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      # upload-pages-artifact v5 nutzt intern upload-artifact v7 (Node 24).
      # Seit v4 werden Dotfiles standardmässig ausgeschlossen — wir brauchen
      # aber das von build.mjs erzeugte dist/.nojekyll, sonst ignoriert
      # GitHub Pages Dateien und Ordner mit Unterstrich.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
